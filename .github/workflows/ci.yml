name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python, ${{ matrix.os }})
    # Every platform the engine captures audio on: ScreenCaptureKit on macOS,
    # WASAPI loopback on Windows, PulseAudio/PipeWire monitors on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uvx ruff@0.17.0 check .
      - name: Install (lock file must be up to date)
        run: uv sync --locked --extra claude
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        # Tests that need macOS `say` or Apple Silicon skip themselves here,
        # so the floor sits below the 78% measured on a Mac. Raise, never lower.
        run: uv run --with pytest-cov pytest -q --cov=continuum --cov-report=term --cov-fail-under=70
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest -q

  desktop:
    name: Desktop (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test with coverage (floor 50% of lines; raise, never lower)
        run: pnpm exec vitest run --coverage --coverage.reporter=text-summary --coverage.thresholds.lines=50
      - run: pnpm exec vite build

  shell:
    name: Desktop shell (Rust)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build the frontend Tauri embeds
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile && pnpm exec vite build
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test
