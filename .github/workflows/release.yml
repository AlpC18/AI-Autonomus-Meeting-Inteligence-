#
# Builds the app for macOS (Apple Silicon and Intel), Windows and Linux for a
# version tag (v0.2.0, ...) and publishes them as one draft GitHub release with the signed updater manifest (latest.json) that
# installed apps check. Publish the draft to roll the update out.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (required; contents of
# ~/.tauri/continuum-updater.key). For a signed and notarised app also
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific) and
# APPLE_TEAM_ID; without them the app is built unsigned.

name: Release

# On pull requests that touch packaging (and by hand), the same builds run
# without publishing, and each installer is installed on a fresh machine and
# its bundled engine started.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/**
      - apps/desktop/scripts/**
      - engine/pyproject.toml
      - engine/uv.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but tauri.conf.json says $version"; exit 1; }
      # One release made up front, so the parallel builds cannot each create their own draft.
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace("refs/tags/", ""),
              name: `Recall ${context.ref.replace("refs/tags/", "")}`,
              draft: true,
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: release
    # Also runs when the release job is skipped (pull requests).
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Apple signing, only for the secrets that are set
        if: runner.os == 'macOS'
        # An empty APPLE_CERTIFICATE makes Tauri import an empty certificate and
        # fail, so secrets that are not set must not reach the build at all.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ "${!name}" != "" ]; then
              { echo "$name<<__END__"; echo "${!name}"; echo "__END__"; } >> "$GITHUB_ENV"
            fi
          done
      # ponytail: each build merges its platform into the release's latest.json;
      # builds finish minutes apart, so a lost update is unlikely. Generate
      # latest.json in a final job if a platform ever goes missing from it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true
          args: >-
            --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
            ${{ github.event_name == 'push' && '--config src-tauri/tauri.release.conf.json' || '' }}

      # Install what users download and start its engine as the app does.
      - name: Rosetta, to run the Intel build on an Apple Silicon runner
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Install and start the engine (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Recall.app/Contents"
          node scripts/smoke-bundle.mjs "$app/Resources/engine" "$app/MacOS/recall-uv"
      - name: Install and start the engine (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          deb=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          sudo apt-get install -y "./$deb"
          files=$(dpkg -L "$(dpkg-deb -f "$deb" Package)")
          engine=$(dirname "$(echo "$files" | grep '/engine/pyproject.toml$')")
          uv=$(echo "$files" | grep '/recall-uv$')
          node scripts/smoke-bundle.mjs "$engine" "$uv"
      - name: Install and start the engine (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Recall"
          $engine = (Get-ChildItem $dir -Recurse -Filter pyproject.toml | Where-Object { $_.Directory.Name -eq "engine" } | Select-Object -First 1).DirectoryName
          $uv = (Get-ChildItem $dir -Recurse -Filter recall-uv.exe | Select-Object -First 1).FullName
          node scripts/smoke-bundle.mjs $engine $uv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
