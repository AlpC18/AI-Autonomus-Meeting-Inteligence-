[project]
name = "continuum"
version = "0.1.0"
description = "Project Continuum engine: audio, diarization, memory, and MCP actions"
license = "MIT"
authors = [
    { name = "Yüksel Alp Çiğtekin", email = "alpcigtekin53@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "fastembed>=0.9.0",
    "faster-whisper>=1.2.1",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyobjc-framework-coreaudio>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-screencapturekit>=12.2.2 ; sys_platform == 'darwin'",
    "qdrant-client>=1.19.1",
    "soundcard>=0.4.3 ; sys_platform != 'darwin'",
    "sounddevice>=0.5.6",
    "websockets>=17.2",
]

[project.scripts]
continuum-actions = "continuum.actions.server:main"
continuum-engine = "continuum.pipeline:main"
continuum-memory-search = "continuum.memory.cli:main"
continuum-actions-review = "continuum.actions.review_cli:main"
continuum-transcribe = "continuum.transcribe_cli:main"
continuum-summarize = "continuum.summarize_cli:main"
continuum-library = "continuum.library:main"
continuum-check-config = "continuum.config_check:main"
continuum-ask = "continuum.ask:main"
continuum-detect-call = "continuum.audio.call_detect:main"

[project.optional-dependencies]
diarization = [
    "pyannote-audio>=4.0.7",
]
claude = [
    "anthropic>=1",
]
apple = [
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
